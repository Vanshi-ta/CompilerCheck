name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Clang (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Show compiler (macOS ships Apple Clang)
        if: runner.os == 'macOS'
        run: clang --version

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: python -m pytest tests/unit -q

      - name: Integration tests (require Clang; skipped with a reason otherwise)
        run: python -m pytest tests/integration -q

      - name: Environment check
        run: python -m compilercheck doctor

      - name: Smoke verification run
        run: python -m compilercheck run --suite smoke

      - name: Generated verification run
        run: python -m compilercheck run --suite generated --seed 42 --count 50

      - name: Regression suite
        run: python -m compilercheck regressions run

      - name: Upload reports and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compilercheck-out-${{ matrix.os }}-py${{ matrix.python-version }}
          path: compilercheck-out/
          if-no-files-found: ignore
