[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compilercheck"
version = "0.1.0"
description = "Differential testing framework that compares C/C++ program behavior across compiler optimization levels"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
compilercheck = "compilercheck.cli:main"

[tool.setuptools.packages.find]
include = ["compilercheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Conservative rule set: pycodestyle errors and pyflakes.
select = ["E4", "E7", "E9", "F"]
